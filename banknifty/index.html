const KN="dashKey:"+location.pathname;   // Nifty and Bank Nifty pages each remember their own key
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(B.s),iterations:B.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(key){const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:hex(B.i)},key,b64(B.d)));
 document.open();document.write(html);document.close()}
(async()=>{let k=null;try{k=localStorage.getItem(KN)}catch(e){}
 if(k){try{await open(await crypto.subtle.importKey("raw",b64(k),"AES-GCM",true,["decrypt"]));return}catch(e){try{localStorage.removeItem(KN)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="Opening…";
 try{const key=await keyFrom(document.getElementById("pw").value);
  if(document.getElementById("rem").checked){const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
   try{localStorage.setItem(KN,btoa(String.fromCharCode(...raw)))}catch(_){}}
  await open(key)}catch(x){err.textContent="Wrong password"}});
</script></body></html>
